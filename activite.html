/* Mise en page : une scène de veillée plein écran pour TBI. Toutes les tailles sont en rem et la taille de base suit
   la dimension la plus contraignante de l'écran (largeur ou hauteur), comme une diapositive :
   un écran qui entre à 1080p entre aussi en fenêtre, à 125 %, en 4K et sur un projecteur. */
:root{
  --nuit:#0a0e16; --nuit-2:#121827; --nuit-3:#1b2336;
  --parchemin:#ece0c4; --parchemin-2:#b9ad93;
  --cire:#f0b257; --cire-2:#ffdc9a;
  --sang:#c0473f; --follet:#86dcc8; --fumee:#7d879b;
  --encre:#2a2116; --encre-2:#7a4a1c;
  --f-titre:"IM Fell English SC","IM Fell English",Georgia,"Times New Roman",serif;
  --f-recit:"IM Fell English",Georgia,"Times New Roman",serif;
  --f-corps:"Alegreya Sans","Segoe UI",system-ui,sans-serif;
  --k:1;
  color-scheme:dark;
  font-size:calc(clamp(12px,min(1.45vw,2.58vh),34px) * var(--k));
}
html,body{height:100%}
body{background:var(--nuit);color:var(--parchemin);font-family:var(--f-corps);margin:0;overflow:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--cire);outline-offset:3px}

/* Atmosphère */
#braises{position:fixed;inset:0;z-index:0;pointer-events:none}
.brume{position:fixed;inset:-20% -20%;z-index:0;pointer-events:none;opacity:.5;
  background:radial-gradient(ellipse 40% 25% at 30% 80%,rgba(125,135,155,.18),transparent 70%),
             radial-gradient(ellipse 35% 20% at 75% 90%,rgba(125,135,155,.14),transparent 70%);
  animation:derive 38s ease-in-out infinite alternate}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 85% 80% at 50% 45%,transparent 55%,rgba(0,0,0,.75) 100%)}
.lueur{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(circle at 50% 110%,rgba(240,178,87,.13),transparent 55%);
  animation:vacille 4s infinite}
@keyframes derive{to{transform:translate(6%,-4%)}}
@keyframes vacille{0%,100%{opacity:1}40%{opacity:.75}55%{opacity:.95}70%{opacity:.8}}

/* Structure */
#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding-inline:max(16px,2rem)}
#scene{flex:1;min-height:0;overflow-y:auto;padding-block:.9rem;display:flex;flex-direction:column}
.barre{display:flex;align-items:center;gap:.5rem;padding-block:.35rem calc(.4rem + env(safe-area-inset-bottom,0px));
  border-top:1px solid rgba(236,224,196,.12);flex-wrap:wrap}
.barre .esp{flex:1}
.btn{background:transparent;border:1px solid rgba(236,224,196,.28);border-radius:4px;padding:.45rem .9rem;font-size:.85rem;letter-spacing:.04em}
.btn:hover{border-color:var(--cire);color:var(--cire-2)}
.btn.plein{background:var(--cire);color:var(--nuit);border-color:var(--cire);font-weight:700}
.btn.plein:hover{background:var(--cire-2);color:var(--nuit)}
.btn.gros{font-size:1.1rem;padding:.7rem 1.4rem}
.btn[disabled]{opacity:.35;pointer-events:none}
.barre .btn{font-size:.72rem;padding:.32rem .75rem}
.fil{font-size:.66rem;color:var(--fumee);letter-spacing:.12em;text-transform:uppercase;font-variant-numeric:tabular-nums}

.eyebrow{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--cire)}
h1,h2,h3{font-family:var(--f-titre);font-weight:400;margin:0;text-wrap:balance}
.recit{font-family:var(--f-recit);font-size:1.45rem;line-height:1.5;max-width:42ch}
.recit p{margin:0 0 .8em}
.centre{margin:auto;width:100%;max-width:62rem}
.apparait{animation:apparait .7s ease both}
@keyframes apparait{from{opacity:.001;transform:translateY(10px)}}

/* Titre */
.titre-ecran{text-align:center;display:flex;flex-direction:column;align-items:center;gap:1rem}
.titre-ecran h1{font-family:var(--f-recit);font-size:5.6rem;line-height:1;letter-spacing:.005em;color:var(--parchemin);text-shadow:0 0 40px rgba(240,178,87,.25)}
.titre-ecran h1 em{display:block;font-family:var(--f-recit);font-style:italic;font-size:.28em;color:var(--cire);letter-spacing:.02em;margin-bottom:.3em}
.titre-ecran .sous{font-family:var(--f-recit);font-style:italic;font-size:1.25rem;color:var(--parchemin-2);max-width:44ch;margin:0}
.titre-ecran .actions{margin-top:.3rem;justify-content:center}
.titre-ecran .note{margin:0}
.sceau{width:4.4rem;height:auto}

/* Configuration */
.config{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:2.5rem;align-items:start}
.config h2{font-size:2.6rem;margin-bottom:.4rem}
.champ{display:flex;flex-direction:column;gap:.35rem;margin-bottom:1.1rem}
.champ label{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--parchemin-2)}
select,input[type=text]{background:var(--nuit-2);border:1px solid rgba(236,224,196,.25);color:var(--parchemin);border-radius:4px;padding:.5rem .7rem;font:inherit;font-size:1rem}
.noms{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.noms .nom{display:flex;align-items:center;gap:.5rem}
.noms .num{font-family:var(--f-corps);font-weight:800;color:var(--cire);width:1.6rem;text-align:right;font-variant-numeric:tabular-nums}
.noms input{width:100%;min-width:0}
.note{font-size:.85rem;color:var(--fumee);line-height:1.45}

/* Chapitre */
.chap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2.8rem;align-items:center}
.chap .chiffre{font-family:var(--f-titre);font-size:11rem;line-height:.8;color:transparent;-webkit-text-stroke:2px var(--cire);opacity:.9}
.chap h2{font-size:3.45rem;line-height:1;margin:.2em 0 .25em}
.chap .lieu{font-family:var(--f-recit);font-style:italic;font-size:1.3rem;color:var(--follet);margin-bottom:1.2rem}

/* Question, avant la réponse */
.q-tete{display:flex;align-items:baseline;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.pastille{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;padding:.25rem .65rem;border-radius:99px;border:1px solid currentColor}
.pastille.maudite{color:var(--sang);background:rgba(192,71,63,.12)}
.pastille.valeur{color:var(--follet)}
.q-corps{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2rem;align-items:start}
.enonce{font-family:var(--f-recit);font-size:2.15rem;line-height:1.18;margin:0 0 1.1rem;text-wrap:balance}
.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.options.vf{grid-template-columns:repeat(2,minmax(0,1fr))}
.opt{display:flex;gap:1rem;align-items:center;padding:1rem 1.2rem;border:1px solid rgba(236,224,196,.22);background:rgba(18,24,39,.72);border-radius:6px;font-size:1.45rem;line-height:1.25;min-height:4.4rem;transition:opacity .5s,background-color .5s,border-color .5s,box-shadow .5s,filter .5s}
.opt .lettre{font-family:var(--f-titre);font-size:1.9rem;color:var(--cire);width:1.6rem;flex:none;text-align:center}
.options.vf .opt{justify-content:center;font-family:var(--f-titre);font-size:3rem;min-height:7rem}
.opt.bonne{border-color:var(--follet);background:rgba(134,220,200,.14);box-shadow:0 0 30px rgba(134,220,200,.25)}
.opt.bonne .lettre{color:var(--follet)}
.opt.eteinte{opacity:.28;filter:grayscale(1)}
.opt.barree{opacity:.18;text-decoration:line-through}
.evenements{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.9rem}
.indices{display:flex;flex-direction:column;gap:.6rem;margin-bottom:1rem}
.indice{display:flex;gap:1rem;align-items:baseline;padding:.75rem 1rem;border-left:3px solid var(--cire);background:rgba(18,24,39,.72);font-size:1.4rem;line-height:1.3}
.indice .n{font-family:var(--f-titre);color:var(--cire);font-size:1.5rem;flex:none}
.indice.cache{border-left-color:rgba(236,224,196,.15);color:var(--fumee);font-style:italic}
.reponse-ouverte{font-family:var(--f-titre);font-size:2.6rem;color:var(--follet);margin:.4rem 0 1rem}
.savais{margin-top:1.2rem;padding:1rem 1.3rem;border:1px solid rgba(134,220,200,.35);border-radius:6px;background:rgba(10,14,22,.8);font-size:1.15rem;line-height:1.5;max-width:70ch}
.savais b{color:var(--follet);letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;display:block;margin-bottom:.3rem}
.actions{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1.2rem}

/* Question, après la réponse : la réponse à gauche, la correction à droite */
.duo{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:2.2rem;align-items:start}
.duo-g,.duo-d{min-width:0}
.revele .enonce{font-size:1.5rem;margin-bottom:.7rem}
.revele .options{grid-template-columns:minmax(0,1fr);gap:.4rem}
.revele .options.vf{grid-template-columns:repeat(2,minmax(0,1fr))}
.revele .opt{min-height:0;padding:.45rem .9rem;font-size:1.08rem;gap:.8rem}
.revele .opt .lettre{font-size:1.3rem}
.revele .options.vf .opt{font-size:1.8rem;padding:.5rem}
.revele .indices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem;margin-bottom:.4rem}
.revele .indice{padding:.4rem .7rem;font-size:.95rem;gap:.6rem}
.revele .indice .n{font-size:1.15rem}
.revele .reponse-ouverte{font-size:1.8rem;margin:.2rem 0 .3rem}
.revele .savais{margin-top:.7rem;padding:.75rem 1rem;font-size:1rem;line-height:1.45}
.chrono{display:flex;flex-direction:column;gap:.35rem}
.chrono .ev{display:flex;gap:.8rem;align-items:baseline;padding:.4rem .8rem;border-left:3px solid var(--follet);background:rgba(134,220,200,.08);font-size:1.02rem;line-height:1.3}
.chrono .an{font-weight:800;color:var(--follet);font-variant-numeric:tabular-nums;flex:none}
.chrono .lt{font-family:var(--f-titre);color:var(--cire);flex:none}
.correction{border-left:1px dashed rgba(236,224,196,.22);padding-left:1.6rem}
.correction .consigne{font-weight:700;font-size:.95rem;color:var(--parchemin-2);line-height:1.35;margin:.25rem 0 .7rem}
.jetons{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.45rem}
.jeton{min-width:0;border:1px solid rgba(236,224,196,.3);background:var(--nuit-2);border-radius:6px;padding:.5rem .75rem;font-size:1rem;line-height:1.2;display:flex;gap:.5rem;align-items:center;justify-content:space-between;text-align:left}
.jetons.grands .jeton{padding:.75rem .9rem;font-size:1.12rem}
.jeton .nm{min-width:0;overflow-wrap:break-word}
.jeton .det{display:block;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--parchemin-2);margin-top:.15rem}
.jeton .pts{font-weight:800;font-variant-numeric:tabular-nums;color:var(--fumee);flex:none}
.jeton.oui{border-color:var(--follet);background:rgba(134,220,200,.16)}
.jeton.oui .pts{color:var(--follet)}
.jeton.non{border-color:var(--sang);background:rgba(192,71,63,.14)}
.jeton.non .pts{color:#f0a49e}

/* Chandelle minuterie */
.chandelle{display:flex;flex-direction:column;align-items:center;gap:.4rem;width:6.5rem;padding-top:2.4rem}
.chandelle .tube{position:relative;height:11rem;width:2.6rem;display:flex;flex-direction:column;justify-content:flex-end}
.chandelle .cire{width:100%;background:linear-gradient(90deg,#d9caa5,#f4e9cf 45%,#cbbb93);border-radius:3px 3px 2px 2px;position:relative;transition:height 1s linear}
.chandelle .flamme{position:absolute;left:50%;top:-2.6rem;width:1.1rem;height:2.4rem;transform:translateX(-50%);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff7d6 0 20%,var(--cire-2) 35%,var(--cire) 60%,rgba(240,120,40,0) 75%);
  filter:drop-shadow(0 0 14px rgba(240,178,87,.8));animation:flamme .18s infinite alternate}
.chandelle.eteinte .flamme{opacity:0}
.chandelle .temps{font-family:var(--f-corps);font-weight:800;font-size:2.1rem;font-variant-numeric:tabular-nums}
.chandelle.urgence .temps{color:var(--sang)}
.chandelle .bt{display:flex;gap:.3rem}
.chandelle.horiz{flex-direction:row;width:auto;align-items:center;gap:.6rem;padding-top:0}
.chandelle.horiz .tube{height:.7rem;width:7rem;flex-direction:row;justify-content:flex-start;background:rgba(42,33,22,.18);border-radius:99px;overflow:hidden}
.chandelle.horiz .cire{height:100%;background:linear-gradient(90deg,#c9772a,var(--cire));border-radius:99px;transition:width 1s linear}
.chandelle.horiz .flamme{display:none}
.chandelle.horiz .temps{font-size:1.5rem;color:var(--encre)}
.chandelle.horiz.urgence .temps{color:#8b2a22}
@keyframes flamme{to{transform:translateX(-50%) scaleY(1.08) skewX(2deg)}}
.chandelier{display:flex;flex-direction:column;align-items:center;gap:.4rem;padding-top:2.4rem}
.bougies{display:flex;gap:.6rem;align-items:flex-end}
.bougie{display:flex;flex-direction:column;align-items:center;gap:.2rem;width:2.2rem}
.bougie .tube{position:relative;height:10rem;width:1.5rem;display:flex;flex-direction:column;justify-content:flex-end}
.bougie .cire{position:relative;width:100%;min-height:.4rem;background:linear-gradient(90deg,#d9caa5,#f4e9cf 45%,#cbbb93);border-radius:3px 3px 2px 2px;transition:height 1s linear,filter .6s}
.bougie .flamme{position:absolute;left:50%;top:-2.2rem;width:.95rem;height:2.1rem;transform:translateX(-50%);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff7d6 0 20%,var(--cire-2) 35%,var(--cire) 60%,rgba(240,120,40,0) 75%);
  filter:drop-shadow(0 0 12px rgba(240,178,87,.8));animation:flamme .18s infinite alternate;opacity:0;transition:opacity .4s}
.bougie.allumee .flamme{opacity:1}
.bougie .cire::before{content:"";position:absolute;left:50%;top:-.5rem;width:2px;height:.5rem;background:#2e261d;transform:translateX(-50%)}
.bougie.urgence .flamme{animation-duration:.08s}
.bougie.attente .cire{filter:brightness(.5) saturate(.5)}
.bougie.eteinte .cire{filter:brightness(.42) saturate(.3)}
.bougie .fumee{position:absolute;left:50%;top:-.6rem;width:.7rem;height:1.6rem;margin-left:-.35rem;border-radius:50%;background:radial-gradient(ellipse,rgba(205,205,215,.6),rgba(205,205,215,0) 70%);opacity:0;pointer-events:none}
.bougie.souffle .fumee{animation:fumee 2.4s ease-out both}
@keyframes fumee{0%{opacity:.95;transform:translateY(0) scale(.6)}100%{opacity:0;transform:translateY(-3.4rem) scale(1.9,2.4)}}
.bougie .num{font-family:var(--f-titre);font-size:1.15rem;line-height:1;color:var(--cire);margin-top:.15rem}
.bougie .val{font-size:.62rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--parchemin-2);white-space:nowrap}
.bougie.eteinte .num{color:var(--fumee)}
.bougie.eteinte .val{color:var(--fumee);text-decoration:line-through}
.chandelier .temps{font-family:var(--f-corps);font-weight:800;font-size:2.1rem;font-variant-numeric:tabular-nums}
.chandelier .temps.urgence{color:var(--sang)}
.chandelier .bt{display:flex;gap:.3rem}
.indice.revelation{animation:revelation 1.1s ease both}
@keyframes revelation{from{opacity:0;filter:blur(5px);transform:translateX(-.6rem)}}
.mini{border:1px solid rgba(236,224,196,.25);background:transparent;border-radius:4px;padding:.2rem .5rem;font-size:.9rem;font-variant-numeric:tabular-nums}

/* Page du grimoire */
.page-grim{max-width:62rem;margin:auto;position:relative;padding:2.4rem;color:var(--encre);
  background:radial-gradient(ellipse at 30% 20%,#f3e7c9,#e2d0a6 60%,#c9b27f);border-radius:3px;
  box-shadow:0 0 0 1px #8a7348,0 30px 80px rgba(0,0,0,.6),inset 0 0 80px rgba(110,80,30,.35);transform:rotate(-.6deg)}
.page-grim .eyebrow{color:var(--encre-2)}
.page-grim h2{font-size:2.6rem;margin:.3rem 0 1rem;color:var(--encre)}
.page-grim .texte{font-family:var(--f-recit);font-size:1.75rem;line-height:1.4}
.page-grim .rayer{margin-top:1.3rem;display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;font-size:1.05rem}
.page-grim .rayer span.t{font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:var(--encre-2)}
.page-grim .code{margin-top:.9rem;display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:baseline;font-family:var(--f-recit);font-style:italic;font-size:1.25rem;color:#5a3d16}
.page-grim .code span.t{font-family:var(--f-corps);font-style:normal;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.8rem;color:#8b2a22}
.page-grim.compacte{padding:1.7rem 2.1rem;margin-bottom:1.1rem}
.page-grim.compacte h2{font-size:2.2rem;margin:.15rem 0 .6rem}
.page-grim.compacte .texte{font-size:1.5rem;line-height:1.38}
.page-grim.compacte .rayer{margin-top:.9rem}
.page-grim.compacte .code{margin-top:.6rem}
.choix .expl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.45rem}
.choix .expl li{font-size:1rem;line-height:1.4}
.choix .expl .n{font-family:var(--f-titre);color:var(--cire);font-size:1.1rem;margin-right:.45rem}
.choix .fausse{margin:.8rem 0 0;font-size:.95rem;line-height:1.4;color:var(--parchemin-2);font-style:italic}
.rature{font-family:var(--f-titre);font-size:1.5rem;position:relative;padding:0 .3rem}
.rature::after{content:"";position:absolute;left:-4%;right:-4%;top:52%;height:3px;background:#8b2a22;transform:scaleX(0) rotate(-3deg);transform-origin:left;animation:raye .6s .9s ease forwards}
@keyframes raye{to{transform:scaleX(1) rotate(-3deg)}}
.encre{animation:encre 1.6s ease both}
@keyframes encre{from{opacity:0;filter:blur(6px)}}

/* Fiche historique : consignes, puis mode lecture plein écran */
.fiche-titre{font-size:3.1rem;line-height:1;margin:.2em 0 .1em}
.alerte{font-family:var(--f-titre);font-size:2.4rem;color:var(--sang);margin:.6rem 0 0;animation:apparait .5s ease both}
.lecture{flex:1;min-height:0;display:flex;flex-direction:column;gap:.45rem;color:var(--encre);background:radial-gradient(ellipse at 30% 20%,#f3e7c9,#e2d0a6 60%,#c9b27f);border-radius:3px;box-shadow:0 0 0 1px #8a7348,0 20px 60px rgba(0,0,0,.55);padding:.6rem 1.1rem .45rem}
.lecture-tete{display:flex;align-items:center;gap:1rem;border-bottom:1px solid #8a7348;padding-bottom:.35rem;flex-wrap:wrap}
.lecture-tete .titres{flex:1;min-width:0}
.lecture-tete .eyebrow{color:var(--encre-2);margin:0;font-size:.66rem}
.lecture-tete h3{font-size:1.65rem;color:var(--encre);line-height:1.05}
.lecture-tete .lieu{font-family:var(--f-recit);font-style:italic;color:#6b4a22;margin:0;font-size:.9rem}
.lecture .mini,.lecture .btn{border-color:rgba(42,33,22,.45);color:var(--encre)}
.lecture .btn:hover{border-color:var(--encre-2);color:var(--encre-2)}
.lecture-corps{flex:1;min-height:0;columns:3;column-gap:1.3rem;column-fill:auto;overflow:hidden}
.lecture-corps section{margin-bottom:.55em}
.lecture-corps h4{font-family:var(--f-titre);font-weight:400;font-size:1.2em;margin:0 0 .2em;color:var(--encre-2);break-after:avoid}
.lecture-corps p{margin:0 0 .45em;line-height:1.3}
.lecture .credit{margin:0;font-size:.6rem;color:#5a4a33;font-style:italic}

.malefice{display:flex;flex-wrap:wrap;gap:.3rem 1rem;align-items:baseline;margin:-.2rem 0 1rem;padding:.6rem 1rem;border:1px solid var(--cire);border-radius:6px;background:rgba(240,178,87,.1);font-size:1.05rem;animation:malefice 1.4s ease both}
.malefice b{font-family:var(--f-titre);font-weight:400;font-size:1.3rem;color:var(--cire)}
@keyframes malefice{0%{box-shadow:0 0 0 rgba(240,178,87,0)}30%{box-shadow:0 0 40px rgba(240,178,87,.55)}100%{box-shadow:0 0 0 rgba(240,178,87,0)}}

/* Tableau des chandelles */
.tableau h2{font-size:2.8rem;text-align:center;margin-bottom:1rem}
.cierges{--bloc:4.6rem;display:flex;justify-content:center;align-items:stretch;gap:1.4rem;height:19rem}
.cierge{display:flex;flex-direction:column;align-items:center;gap:.4rem;flex:1;max-width:8rem;min-width:0}
.cierge .zone{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.cierge .score{font-family:var(--f-corps);font-weight:800;font-size:1.8rem;line-height:1.2;font-variant-numeric:tabular-nums;margin-bottom:2.4rem;flex:none}
/* La hauteur de la chandelle est proportionnelle aux points : (--h) de l'espace laissé par le pointage et la flamme. */
.cierge .corps{--h:0;position:relative;flex:none;width:55%;height:calc((100% - var(--bloc)) * var(--h));min-height:6px;background:linear-gradient(90deg,#d9caa5,#f4e9cf 45%,#cbbb93);border-radius:3px;transition:height 1.2s cubic-bezier(.2,.8,.2,1)}
.cierge .corps .flamme{position:absolute;left:50%;top:-2.2rem;width:.9rem;height:2rem;transform:translateX(-50%);border-radius:50% 50% 45% 45%/60% 60% 40% 40%;
  background:radial-gradient(ellipse at 50% 75%,#fff7d6 0 20%,var(--cire-2) 35%,var(--cire) 60%,rgba(240,120,40,0) 75%);filter:drop-shadow(0 0 12px rgba(240,178,87,.8));animation:flamme .2s infinite alternate}
.cierge.tete .corps .flamme{filter:drop-shadow(0 0 22px rgba(134,220,200,.95));background:radial-gradient(ellipse at 50% 75%,#f2fffb 0 20%,#c6f3e8 35%,var(--follet) 60%,rgba(134,220,200,0) 75%)}
.cierge .nomeq{font-size:.95rem;text-align:center;line-height:1.15;min-height:2.3em;overflow-wrap:break-word;max-width:100%}
.tableau.deux h2{font-size:2.3rem;margin-bottom:.3rem}
.cierges.deux{--bloc:3.9rem;height:10.6rem}
.cierges.deux+.cierges.deux{margin-top:.6rem}
.cierges.deux .score{font-size:1.4rem;margin-bottom:2.2rem}
.ajout{display:flex;gap:.8rem 1.6rem;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:1.2rem}
.ajout-f{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.ajout-f input{min-width:0;width:15rem;max-width:100%}

/* Roue */
.roue-zone{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3rem;align-items:center}
.roue-zone canvas{width:20rem;height:auto;max-width:100%}
.roue-zone h2{font-size:3rem;margin-bottom:.6rem}
.verdict{font-family:var(--f-recit);font-size:1.6rem;line-height:1.35;min-height:6rem}
.verdict b{display:block;font-family:var(--f-titre);font-weight:400;font-size:2.4rem;color:var(--cire);margin-bottom:.3rem}
.fleche{position:relative}
.fleche::after{content:"";position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:16px solid transparent;border-top:30px solid var(--cire);filter:drop-shadow(0 4px 6px rgba(0,0,0,.6))}

/* Finale */
.liste-ind{display:flex;flex-direction:column;gap:.35rem;font-size:1.05rem;line-height:1.35;max-width:80ch}
.liste-ind .n{font-family:var(--f-titre);color:var(--cire);margin-right:.4rem}
.moment{display:inline-flex;gap:.6rem;align-items:baseline;padding:.6rem 1rem;border:1px solid var(--sang);border-radius:6px;background:rgba(192,71,63,.1);font-size:1.15rem;margin-top:1rem}
.moment b{font-family:var(--f-titre);font-weight:400;font-size:1.6rem;color:var(--sang)}
.titre-dev{font-size:3rem}
.devoile{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.2rem;margin:1.2rem 0}
.carte{border:1px solid rgba(236,224,196,.25);border-radius:8px;padding:1.2rem;text-align:center;background:var(--nuit-2);min-height:9rem;display:flex;flex-direction:column;justify-content:center;gap:.4rem}
.carte .t{font-size:.8rem;letter-spacing:.2em;text-transform:uppercase;color:var(--parchemin-2)}
.carte .v{font-family:var(--f-titre);font-size:2.4rem;color:var(--follet)}
.carte.cachee .v{color:var(--fumee)}
.carte.vue{animation:retourne .8s ease both;border-color:var(--follet);box-shadow:0 0 40px rgba(134,220,200,.2)}
@keyframes retourne{from{transform:rotateY(90deg)}}
.suite{margin-top:.9rem}
.billets .rappel{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;align-items:baseline;margin:.6rem 0 .4rem;font-size:1rem;color:var(--parchemin-2)}
.billets .rappel b{font-family:var(--f-titre);font-weight:400;font-size:1.7rem;color:var(--follet)}
.billets .note{margin:.2rem 0 1rem}
.billets .jetons{grid-template-columns:repeat(auto-fill,minmax(13rem,1fr))}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:1.5rem;margin-top:1.4rem}
.marche{text-align:center;display:flex;flex-direction:column;gap:.45rem;align-items:center;width:12rem}
.marche .socle{width:100%;background:linear-gradient(var(--nuit-3),var(--nuit-2));border:1px solid rgba(236,224,196,.2);border-bottom:none;border-radius:6px 6px 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:.5rem;font-family:var(--f-corps);font-weight:800;font-size:2.4rem;color:var(--cire)}
.marche .nm{font-family:var(--f-titre);font-size:1.4rem;line-height:1.1;overflow-wrap:break-word;max-width:100%}
.marche .sc{font-size:1.05rem;color:var(--parchemin-2);font-variant-numeric:tabular-nums}

/* Fenêtres de choix (correction de la maudite et des billets) */
.choix{position:fixed;inset:0;z-index:30;background:rgba(5,7,12,.86);display:flex;align-items:center;justify-content:center;padding:1rem}
.choix .boite{width:min(56rem,100%);max-height:100%;overflow:auto;background:var(--nuit-2);border:1px solid rgba(236,224,196,.3);border-radius:10px;padding:1.4rem 1.6rem;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.choix h3{font-size:2rem;margin-bottom:.2rem}
.choix .sous{color:var(--parchemin-2);margin:0 0 1rem;font-size:1rem}
.choix .etiq{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--parchemin-2);margin:0 0 .45rem}
.choix .rangee{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:1.1rem}
.choix .opt-c{flex:1 1 6rem;border:1px solid rgba(236,224,196,.3);background:var(--nuit);border-radius:8px;padding:.9rem .6rem;font-size:1.2rem;font-weight:800;text-align:center;line-height:1.2}
.choix .opt-c small{display:block;font-size:.72rem;font-weight:700;opacity:.85;margin-top:.2rem}
.choix .opt-c.perd{color:#f0a49e;border-color:rgba(192,71,63,.6);background:rgba(192,71,63,.12)}
.choix .opt-c.gagne{color:var(--follet);border-color:rgba(134,220,200,.55);background:rgba(134,220,200,.1)}
.choix .boite:focus{outline:none}
.choix .opt-c:focus-visible{outline:3px dashed var(--parchemin-2);outline-offset:2px}
.choix .opt-c.on{outline:3px solid var(--cire);outline-offset:2px;box-shadow:inset 0 0 0 99rem rgba(240,178,87,.16)}
.choix .opt-c[disabled]{opacity:.3;cursor:default}
.choix .bas{display:flex;justify-content:flex-end;align-items:center;gap:.8rem;flex-wrap:wrap}
.choix .total{margin-right:auto;font-size:1.4rem;font-weight:800;color:var(--follet);font-variant-numeric:tabular-nums}

.aide{position:fixed;inset:0;z-index:20;background:rgba(5,7,12,.92);display:flex;align-items:center;justify-content:center;padding:1rem}
.aide .boite{max-width:46rem;background:var(--nuit-2);border:1px solid rgba(236,224,196,.25);border-radius:8px;padding:1.6rem;font-size:1rem;line-height:1.5}
.aide kbd{border:1px solid var(--fumee);border-radius:3px;padding:0 .35rem;font-family:var(--f-corps);font-size:.85em}
/* Documents à imprimer, accessibles en tout temps (bouton Documents, touche D) */
.documents{position:fixed;inset:0;z-index:26;background:rgba(5,7,12,.9);display:flex;align-items:center;justify-content:center;padding:1rem}
.documents .boite{width:min(46rem,100%);max-height:100%;overflow:auto;background:var(--nuit-2);border:1px solid rgba(236,224,196,.28);border-radius:10px;padding:1.4rem 1.6rem;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.documents h3{font-size:2rem;margin-bottom:.2rem}
.documents .sous{color:var(--parchemin-2);margin:0 0 .8rem;font-size:1rem}
.documents .doc{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.3rem .6rem;align-items:center;padding:.8rem 0;border-top:1px solid rgba(236,224,196,.14)}
.documents .doc b{display:block;font-family:var(--f-titre);font-weight:400;font-size:1.35rem;line-height:1.15}
.documents .doc span{display:block;font-size:.95rem;color:var(--parchemin-2)}
.documents .doc .garde{color:#f0a49e;margin-top:.1rem}
.documents .doc .btn{font-size:.95rem;padding:.6rem 1rem}
.documents .etat{min-height:1.4em;margin:.5rem 0 0;font-size:.95rem;color:var(--follet)}
.documents .actions{margin-top:.6rem;justify-content:flex-end}
@media (max-width:560px){ .documents .doc{grid-template-columns:1fr 1fr} .documents .doc>div{grid-column:1/-1} }
.calme .apparait,.calme .encre,.calme .carte.vue{animation:none}

@media (max-width:800px){
  :root{font-size:15px}
  .config,.q-corps,.chap,.roue-zone,.duo{grid-template-columns:minmax(0,1fr)}
  .options,.evenements,.devoile{grid-template-columns:minmax(0,1fr)}
  .chandelle{flex-direction:row;width:auto}
  .chandelle .tube{height:3rem;width:8rem;flex-direction:row}
  .chandelle .flamme{display:none}
  .noms{grid-template-columns:minmax(0,1fr)}
  .correction{border-left:none;padding-left:0;border-top:1px dashed rgba(236,224,196,.22);padding-top:1rem}
  .lecture{flex:none}
  .lecture-corps{columns:1;overflow:visible}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:0s!important}
}
</style>
</head>

const CREDIT = "Activité imaginée par Mathieu Mercier, École secondaire de Rivière-du-Loup. Interface et fiches produites à l'aide de l'intelligence artificielle Claude Opus 5.5 (Anthropic).";
const FICHES = [
{titre:"La Corriveau", sous:"Pointe-Lévy, 1763", blocs:[
  {h:"Une femme bien réelle", p:["Marie-Josephte Corriveau naît en 1733 à Saint-Vallier, une paroisse de la Côte-du-Sud, en face de l'île d'Orléans. À 16 ans, elle épouse Charles Bouchard, un cultivateur avec qui elle a trois enfants. Quelques années plus tard, Bouchard meurt. Des rumeurs circulent dans la paroisse, mais aucune enquête n'est ouverte. En 1761, la veuve se remarie avec Louis Dodier, un autre habitant de Saint-Vallier. Le couple se dispute souvent et les voisins entendent les cris.",
    "Au matin du 27 janvier 1763, on retrouve Louis Dodier mort dans sa grange, la tête couverte de blessures. On parle d'abord d'un coup de sabot de cheval, puis les soupçons se tournent vers le père de Marie-Josephte, Joseph Corriveau, qui s'était déjà battu avec son gendre."]},
  {h:"Le procès d'une colonie conquise", p:["Depuis la capitulation de Montréal en 1760, la colonie n'est plus française. En attendant le traité de Paris, signé en février 1763, elle vit sous le régime militaire britannique, qui durera jusqu'en 1764. La justice est donc rendue par l'armée. Le 29 mars 1763, un tribunal militaire britannique de douze officiers anglais, présidé par le lieutenant-colonel Roger Morris, se réunit chez les Ursulines de Québec.",
    "Le père est d'abord condamné à être pendu. Avant l'exécution, il avoue à un prêtre qu'il n'a pas tué Dodier. Un second procès s'ouvre le 15 avril. Marie-Josephte avoue alors avoir tué son second mari pendant son sommeil. Elle est pendue à Québec le 18 avril 1763. Son corps est ensuite enfermé dans une cage de fer et suspendu à un carrefour de la Pointe-Lévy pendant plus d'un mois, à la vue de tous les passants."]},
  {h:"De l'histoire à la légende", p:["Le peuple n'oublie pas la cage. De bouche à oreille, ses deux maris deviennent trois, cinq, puis sept, tous assassinés de façons plus horribles les unes que les autres. Pourtant, elle n'a été condamnée que pour la mort d'un seul mari. En 1863, Philippe Aubert de Gaspé raconte dans Les Anciens Canadiens qu'un voyageur aurait été agrippé la nuit par la Corriveau, qui le suppliait de la porter jusqu'à l'île d'Orléans, où dansaient les sorciers. En 2001, le groupe Mes Aïeux lui consacre encore une chanson."]},
  {h:"Le voyage de la cage", p:["Vers le milieu du 19e siècle, des travailleurs déterrent la cage par hasard dans le cimetière de Saint-Joseph-de-la-Pointe-Lévy. Elle disparaît peu après, puis réapparaît au Boston Museum. Vers 1899, elle passe à l'Essex Institute de Salem, au Massachusetts, où elle dort dans les réserves pendant plus d'un siècle. Retrouvée par la Société d'histoire régionale de Lévis, elle revient au Québec en 2013 et fait aujourd'hui partie de la collection du Musée de la civilisation, à Québec."]}
]},
{titre:"La chasse-galerie", sous:"Un chantier de bûcherons, veille du jour de l'An", blocs:[
  {h:"Le récit", p:["L'hiver, des milliers d'hommes quittent leur village pour aller bûcher dans les chantiers, au fond des bois, pendant des mois. Dans le récit, nous sommes la veille du jour de l'An. La mélasse mijote pour la partie de tire, mais les bûcherons s'ennuient de leurs blondes, restées très loin au village. Un bûcheron nommé Baptiste propose une solution rapide : courir la chasse-galerie.",
    "Les hommes montent dans le grand canot d'écorce qui sert à la drave et concluent un pacte avec le diable. Le canot s'élève au-dessus de la neige et file plus vite que le vent, à au moins 50 lieues à l'heure. Ils survolent forêts, rivières et villages endormis, et se posent enfin à Lavaltrie, un village de la rive nord du Saint-Laurent, où l'on danse chez un habitant. Au retour, Baptiste, qui a trop bu, gouverne mal le canot, frôle un clocher et lance des jurons. Le voyage tourne mal et les hommes se réveillent dans leur lit, sans trop savoir comment."]},
  {h:"Les trois conditions du pacte", p:["Pendant tout le voyage, personne ne doit prononcer le nom du bon Dieu. Personne ne doit toucher aux croix des clochers en survolant les villages. Enfin, il faut être de retour au chantier avant six heures du matin. Si une seule de ces conditions n'est pas respectée, les âmes de tous les passagers appartiennent au diable."]},
  {h:"L'homme qui l'a écrite", p:["Honoré Beaugrand naît en 1848 à Lanoraie, un village voisin de Lavaltrie. À 17 ans, il quitte le pays et part se battre au Mexique dans l'armée de l'empereur Maximilien, puis vit en France et aux États-Unis, où il fonde L'Écho du Canada, un journal pour les Canadiens français de Fall River, au Massachusetts. De retour au pays, il fonde en 1879 le journal La Patrie, à Montréal. Il devient maire de Montréal de 1885 à 1887, et une station de métro porte aujourd'hui son nom.",
    "Beaugrand publie La chasse-galerie dans La Patrie en 1891. Une version anglaise paraît à New York en 1892, illustrée par Henri Julien, puis le texte est repris dans un recueil en 1900. Beaugrand n'a pas inventé l'histoire : il a mis par écrit un récit que les gens de chantier se racontaient déjà. Le mot lui-même viendrait d'une vieille légende française, celle d'un seigneur condamné à chasser dans le ciel pour l'éternité."]}
]},
{titre:"Le diable beau danseur", sous:"Une maison de campagne, soir du Mardi gras", blocs:[
  {h:"Une nuit de fête qui finit mal", p:["Dans le calendrier catholique, le Mardi gras est la dernière soirée de réjouissances avant le carême, une période de quarante jours de privation et de prière qui mène à Pâques. À minuit commence le mercredi des Cendres : on doit alors cesser de danser, de boire et de festoyer. Danser après minuit, c'était défier l'Église.",
    "Dans la version la plus connue, l'histoire se passe au 18e siècle, chez un habitant nommé Latulipe. Sa fille, Rose, est une jolie brune qui aime trop la fête. Elle est fiancée à un jeune homme nommé Gabriel. Ce soir-là, une cinquantaine d'invités dansent dans la maison quand un traîneau tiré par un superbe cheval noir s'arrête devant la porte. Un étranger très beau, très brun et richement vêtu entre, retire son manteau de fourrure, mais garde ses gants. Il invite Rose à danser, encore et encore, et Gabriel, jaloux, boude dans un coin."]},
  {h:"Les signes qui trahissent le diable", p:["Selon les versions, l'étranger se trahit de différentes façons : ses gants cachent des griffes, son chapeau cache des cornes, son cheval noir fait fondre la neige sous ses sabots, ou sa main brûle celle de Rose. Dans plusieurs versions, le curé arrive juste à temps, chasse le diable avec de l'eau bénite et sauve la jeune fille. Rose entre ensuite au couvent et meurt quelques années plus tard. Dans d'autres versions, le diable l'emporte avec lui."]},
  {h:"Du conte au premier roman", p:["En 1837, la légende paraît dans L'influence d'un livre, de Philippe Aubert de Gaspé fils, imprimé à Québec. On considère ce livre comme le premier roman canadien-français. Le héros, Charles Amand, un habitant de Saint-Jean-Port-Joli, rêve de devenir alchimiste. Dans le roman, c'est un conteur de village qui raconte l'histoire de Rose Latulipe. Plusieurs historiens croient que le père de l'auteur, Philippe Aubert de Gaspé, en a écrit une bonne partie. C'est ce même père qui publiera Les Anciens Canadiens en 1863, à l'âge de 76 ans.",
    "Le folkloriste Jean Du Berger a étudié cette légende. Lui et d'autres chercheurs en ont recensé plus de 200 versions, au Québec et en Acadie. Chaque village la racontait à sa façon."]}
]},
{titre:"Le loup-garou", sous:"Un rang de campagne, nuit d'automne", blocs:[
  {h:"Une punition religieuse", p:["Dans les films, on devient loup-garou quand on se fait mordre par un loup-garou, et la transformation arrive les soirs de pleine lune. Dans la tradition canadienne-française, c'est tout autre chose. Le loup-garou est un chrétien puni pour avoir négligé ses devoirs religieux pendant sept ans. Faire ses Pâques, c'était se confesser et communier au moins une fois par année, au temps de Pâques, après les quarante jours du carême. Celui qui ne l'avait pas fait depuis sept ans risquait de « courir le loup-garou ». On se moquait aussi de ceux qui faisaient des « pâques de renard », c'est-à-dire leurs Pâques à la toute dernière minute.",
    "La nuit, l'homme se change en bête et erre dans la campagne jusqu'au matin. Selon les récits, la bête n'est pas toujours un loup : on parle aussi d'un chien ou d'un chat. Le jour, il reprend sa forme humaine et personne ne se doute de rien. Ces histoires rappelaient aux gens les règles de la communauté et les risques de s'en éloigner."]},
  {h:"Comment le délivrer", p:["Pour libérer quelqu'un qui court le loup-garou, nul besoin d'arme spéciale. Il suffit de le blesser légèrement, avec un couteau ou une fourche, pour faire couler une goutte de son sang. La bête redevient alors humaine, et c'est souvent un voisin bien connu, qui supplie qu'on garde le secret. La fameuse balle d'argent, elle, vient de récits européens popularisés par le cinéma."]},
  {h:"Le conte de Beaugrand", p:["Honoré Beaugrand, l'auteur de La chasse-galerie, a aussi écrit un conte intitulé Le loup-garou, publié dans le même recueil en 1900. Une version anglaise, The Werwolves, paraît en 1898 dans un magazine américain. Dans ce conte, un vieux conteur nommé Pierriche affirme qu'il faut avoir passé sept ans sans aller à confesse pour que le diable s'empare d'un homme. Il explique aussi que la peau d'un loup-garou est une peau de loup « revirée à l'envers, avec le poil en dedans ». Il prétend même avoir vu vingt-cinq loups-garous dans sa vie, et pas un seul!"]}
]},
{titre:"Le cheval noir", sous:"Trois-Pistoles, de 1882 à 1887", blocs:[
  {h:"Une église colossale", p:["Trois-Pistoles, à une soixantaine de kilomètres de Rivière-du-Loup, a eu plusieurs églises. Celle qu'on voit aujourd'hui est la cinquième. Elle porte le nom de Notre-Dame-des-Neiges, qui rappelle une légende romaine où la neige serait tombée en plein mois d'août. Dessinée par l'architecte David Ouellet, elle est bâtie de 1882 à 1887 par les entrepreneurs Augustin Audet et Hubert Morin, puis consacrée en 1888. Elle contient mille places et des statues du sculpteur Louis Jobin. Selon une autre légende, la ville elle-même tiendrait son nom d'un gobelet d'argent d'une valeur de trois pistoles, perdu dans la rivière."]},
  {h:"Le cheval mystérieux", p:["Pendant la construction, les pierres sont lourdes et le travail avance lentement. Un jour, un cheval noir d'une force extraordinaire se présente au chantier. Personne ne sait d'où il vient ni à qui il appartient. On le confie aux ouvriers avec une seule consigne : ne jamais lui enlever sa bride. Le cheval charrie les pierres sans jamais se fatiguer.",

/* ---------- Son (Web Audio, aucun fichier) ---------- */
const Son = (()=>{
  let ctx=null, maitre=null, ambiance=null, minuterieCri=null;
  const NIVEAU_CRI=1, INTERVALLE_CRI=10*60*1000;   /* un cri toutes les 10 minutes d'ambiance */
  function init(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return false; }
    maitre = ctx.createGain(); maitre.gain.value=.9; maitre.connect(ctx.destination); return true;
  }
  function bruit(dur){
    const b = ctx.createBuffer(1, ctx.sampleRate*dur, ctx.sampleRate), d=b.getChannelData(0);
    let last=0; for(let i=0;i<d.length;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.5; }
    const s=ctx.createBufferSource(); s.buffer=b; return s;
  }
  function ton(f,t0,dur,type,vol){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type||"sine"; o.frequency.value=f;
    g.gain.setValueAtTime(0,t0); g.gain.linearRampToValueAtTime(vol||.2,t0+.02); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g); g.connect(maitre); o.start(t0); o.stop(t0+dur+.05);
  }
  /* Cri lointain : une voix aiguë qui monte puis retombe, filtrée comme une voyelle « a » et noyée
     dans l'écho, pour qu'on l'entende venir de loin. Montée douce : inquiétant, jamais un sursaut. */
  function echo(dur){
    const n=Math.floor(ctx.sampleRate*dur), b=ctx.createBuffer(2,n,ctx.sampleRate);
    for(let c=0;c<2;c++){ const d=b.getChannelData(c); for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.6); }
    const cv=ctx.createConvolver(); cv.buffer=b; return cv;
  }
  function crier(t){
    const sortie=ctx.createGain(); sortie.gain.value=NIVEAU_CRI; sortie.connect(maitre);
    const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=3200; lp.connect(sortie);
    const salle=echo(3.2), mouille=ctx.createGain(); mouille.gain.value=.6; salle.connect(mouille); mouille.connect(lp);
    const sec=ctx.createGain(); sec.gain.value=.3; sec.connect(lp);
    const voix=ctx.createGain(); voix.connect(salle); voix.connect(sec);
    /* rugosité : une légère modulation rapide, ce qui distingue un cri d'une simple note */
    const rugo=ctx.createGain(); rugo.gain.value=.72; rugo.connect(voix);
    const am=ctx.createOscillator(), amg=ctx.createGain(); am.frequency.value=52; amg.gain.value=.28; am.connect(amg); amg.connect(rugo.gain);
    voix.gain.setValueAtTime(.0001,t); voix.gain.exponentialRampToValueAtTime(1,t+.45);
    voix.gain.setValueAtTime(1,t+1.4); voix.gain.exponentialRampToValueAtTime(.0001,t+3);
    const o=ctx.createOscillator(); o.type="sawtooth";
    o.frequency.setValueAtTime(600,t); o.frequency.exponentialRampToValueAtTime(1050,t+.45);
    o.frequency.setValueAtTime(1050,t+1.15); o.frequency.exponentialRampToValueAtTime(480,t+3);
    const vib=ctx.createOscillator(), vg=ctx.createGain(); vib.frequency.value=6.3; vg.gain.value=30; vib.connect(vg); vg.connect(o.frequency);
    const lent=ctx.createOscillator(), lg=ctx.createGain(); lent.frequency.value=1.4; lg.gain.value=18; lent.connect(lg); lg.connect(o.frequency);
    const formants=[[850,1,6],[1220,.6,7],[2810,.3,9]].map(([f,g,q])=>{ const b=ctx.createBiquadFilter(); b.type="bandpass"; b.frequency.value=f; b.Q.value=q;
      const gg=ctx.createGain(); gg.gain.value=g; b.connect(gg); gg.connect(rugo); o.connect(b); return b; });
    const souffle=bruit(3.2), sg=ctx.createGain(); sg.gain.value=.1; souffle.connect(sg); formants.forEach(b=>sg.connect(b));
    const fin=t+3.1; [o,vib,lent,am,souffle].forEach(n=>{ n.start(t); n.stop(fin); });
  }
  function demarrerAmbiance(){
    if(!init()||ambiance) return;
    const g=ctx.createGain(); g.gain.value=0; g.gain.linearRampToValueAtTime(.35,ctx.currentTime+3); g.connect(maitre);
    const vent=bruit(8); vent.loop=true; const f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.value=400; f.Q.value=.8;
    const lfo=ctx.createOscillator(), lg=ctx.createGain(); lfo.frequency.value=.07; lg.gain.value=260; lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    vent.connect(f); const vg=ctx.createGain(); vg.gain.value=.5; f.connect(vg); vg.connect(g); vent.start();
    const nappes=[55,82.4,110.3].map((fr,i)=>{ const o=ctx.createOscillator(); o.type="sawtooth"; o.frequency.value=fr; o.detune.value=(i-1)*7;
      const lp=ctx.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=180; const og=ctx.createGain(); og.gain.value=.05;
      o.connect(lp); lp.connect(og); og.connect(g); o.start(); return o; });
    ambiance={g,stop:()=>{ g.gain.linearRampToValueAtTime(0,ctx.currentTime+1); setTimeout(()=>{ try{vent.stop();lfo.stop();nappes.forEach(o=>o.stop());}catch(e){} },1200); }};
    clearInterval(minuterieCri);
    minuterieCri=setInterval(()=>{ if(ambiance && E.son && !document.hidden) effet("cri"); }, INTERVALLE_CRI);
  }
  function arreterAmbiance(){ clearInterval(minuterieCri); minuterieCri=null; if(ambiance){ ambiance.stop(); ambiance=null; } }
  function effet(nom){
    if(!E.son || !init()) return;
    const t=ctx.currentTime;
    if(nom==="revele"){ [220,261.6,329.6,440].forEach((f,i)=>ton(f,t+i*.06,2.4,"triangle",.12)); }
    else if(nom==="bon"){ [523.3,659.3,784,1046.5].forEach((f,i)=>ton(f,t+i*.08,1.2,"sine",.12)); }
    else if(nom==="page"){ const s=bruit(.6), f=ctx.createBiquadFilter(); f.type="highpass"; f.frequency.value=1500; const g=ctx.createGain();
      g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.5,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+.5); s.connect(f); f.connect(g); g.connect(maitre); s.start(t); }
    else if(nom==="tonnerre"){ const s=bruit(4), f=ctx.createBiquadFilter(); f.type="lowpass"; f.frequency.setValueAtTime(900,t); f.frequency.exponentialRampToValueAtTime(80,t+3.5);
      const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(1.6,t+.08); g.gain.exponentialRampToValueAtTime(.0001,t+3.8); s.connect(f); f.connect(g); g.connect(maitre); s.start(t); }
    else if(nom==="tic"){ ton(1800,t,.04,"square",.05); }
    else if(nom==="cri"){ crier(t); }
    else if(nom==="coeur"){ ton(60,t,.25,"sine",.5); ton(55,t+.22,.3,"sine",.4); }
    else if(nom==="souffle"){ const s=bruit(.8), f=ctx.createBiquadFilter(); f.type="bandpass"; f.frequency.setValueAtTime(1400,t); f.frequency.exponentialRampToValueAtTime(380,t+.55); f.Q.value=.8;
      const g=ctx.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(1.1,t+.05); g.gain.exponentialRampToValueAtTime(.0001,t+.6); s.connect(f); f.connect(g); g.connect(maitre); s.start(t); }
    else if(nom==="gong"){ ton(73.4,t,4,"sine",.5); ton(146.8,t,2.5,"triangle",.12); ton(110,t,3,"sine",.15); }
    else if(nom==="cloche"){ [0,1.2,2.4,3.6,4.8,6,7.2].forEach(d=>{ ton(392,t+d,2.2,"sine",.25); ton(784.5,t+d,1.4,"sine",.06); ton(588,t+d,1.6,"triangle",.04); }); }
  }
  return {init, effet, demarrerAmbiance, arreterAmbiance};
})();

/* ---------- Braises (canvas) ---------- */
(function braises(){
  const cv=document.getElementById("braises"), cx=cv.getContext && cv.getContext("2d"); if(!cx) return;
  const reduit = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W,H,pts=[];
  function taille(){ W=cv.width=innerWidth; H=cv.height=innerHeight; }
  taille(); addEventListener("resize",taille);
  for(let i=0;i<55;i++) pts.push({x:Math.random(),y:Math.random(),v:.0004+Math.random()*.0012,r:.6+Math.random()*1.8,p:Math.random()*6.28});
  function dessin(){
    cx.clearRect(0,0,W,H);
    for(const p of pts){
      if(!reduit){ p.y-=p.v; p.p+=.02; if(p.y<-.02){ p.y=1.02; p.x=Math.random(); } }
      const a=.25+.35*Math.sin(p.p);
      cx.beginPath(); cx.arc((p.x+Math.sin(p.p)*.01)*W,p.y*H,p.r,0,6.283);
      cx.fillStyle="rgba(240,178,87,"+a.toFixed(3)+")"; cx.fill();
    }
    if(!reduit) requestAnimationFrame(dessin);
  }
  dessin();
})();

/* Le navigateur accepte le plein écran parce qu'il suit un clic ou une touche. S'il refuse, rien ne change. */
function entrerPleinEcran(){

/* Filet de sécurité : si un écran dépasse malgré tout (noms d'équipes très longs, par exemple),
   l'échelle baisse d'au plus 10 % plutôt que d'obliger à faire défiler. */
const petitEcran = ()=> !!(window.matchMedia && window.matchMedia("(max-width:800px)").matches);
function debordement(){
  const r=scene.firstElementChild; if(!r) return 0;
  const cs=getComputedStyle(scene);
  return r.offsetHeight + (parseFloat(cs.paddingTop)||0) + (parseFloat(cs.paddingBottom)||0) - scene.clientHeight;
}
function ajusterEchelle(){
  const R=document.documentElement; let k=1;
  R.style.setProperty("--k","1");
  if(petitEcran()) return;
  while(debordement()>1 && k>0.905){ k=Math.round((k-0.02)*100)/100; R.style.setProperty("--k",String(k)); }
}

  box.style.setProperty("transition","none","important");

  let lo=8, hi=Math.max(16, H/6);
  for(let i=0;i<16;i++){ const m=(lo+hi)/2; box.style.fontSize=m+"px"; if(tient()) lo=m; else hi=m; }

}

function vQuestion(st){
  const c=CHAPITRES[st.c], q=c.questions[st.q], id=st.id;
  const rev=!!E.rev[id], fx=effetsSur(id);
  const frais = (indiceFrais && indiceFrais.id===id && !rev) ? indiceFrais.k : -1; indiceFrais=null;

  const effets=[];
  if(fx.double) effets.push("Sortilège : cette question vaut double. Les points sont doublés automatiquement.");
  if(fx.brume && E.duree) effets.push("Brume épaisse : la chandelle brûle deux fois plus vite.");
  if(fx.benir && !mauditeCachee) effets.push("Bénédiction : une mauvaise réponse a été rayée.");

  } else if(q.type==="vf"){
    corps = `<p class="enonce">${esc(q.enonce)}</p>
      <div class="options vf">${["Vrai","Faux"].map((t,i)=>`<div class="opt ${rev?(i===q.bonne?"bonne":"eteinte"):""}">${t}</div>`).join("")}</div>`;
  } else if(q.type==="qcm"||q.type==="maudite"){

      <div class="indices">${q.indices.map((t,i)=>`<div class="indice ${i<niv||rev?"":"cache"} ${i===frais?"revelation":""}"><span class="n">${i+1}</span><span>${i<niv||rev?esc(t):"Indice scellé"}</span></div>`).join("")}</div>
      ${rev?`<p class="reponse-ouverte">${esc(q.reponse)}</p>`:""}`;

      : `<p class="enonce">${esc(q.enonce)}</p>
        <div class="evenements">${q.options.map((t,i)=>`<div class="opt"><span class="lettre">${LETTRES[i]}</span><span>${esc(t)}</span></div>`).join("")}</div>`;
  }

  const tete = `<div class="q-tete">
      <span class="eyebrow">${esc(c.nom)} · Question ${st.q+1} de 4</span>
      <span class="pastille ${q.type==="maudite"?"maudite":"valeur"}">${nomType(q)}</span>

  if(rev){

  } else if(!mauditeCachee && duree){

  if($("#bPhase")) $("#bPhase").onclick=()=>{ E.phase[id]=true; Son.effet("tonnerre"); rendre(); };
  if($("#bInd")) $("#bInd").onclick=()=>{
    const n=(E.niv[id]||1)+1; E.niv[id]=n;
    const ch=chronos[id]; if(ch && ch.i!==undefined && ch.i<4){ ch.i=n-1; ch.reste=ch.per; }
    indiceFrais={id, k:n-1}; Son.effet("souffle");
    rendre.garde=true; rendre();
  };
  if($("#bRev")) $("#bRev").onclick=()=>{ E.rev[id]=true; if(chronos[id]) chronos[id].actif=false; if(!E.points[id]) E.points[id]=Array(E.nbEq).fill(0); Son.effet("revele"); rendre(); };
  if(q.type==="indices") brancherChandelier(id, per);
  else if(chandelle) brancherChandelle(id, duree, true);
}

function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function brancherChandelle(cle, duree, auto, aLaFin, libDepart){
  let c=chronos[cle];
  if(!c || c.total!==duree) c=chronos[cle]={total:duree, reste:duree, actif:!!auto};
  const cire=$("#cire"), tps=$("#tps"), ch=$("#chand"), go=$("#tGo");
  const prop = ch.classList.contains("horiz") ? "width" : "height";
  const lib=()=>{ go.textContent = c.actif ? "Pause" : c.reste<=0 ? "Rallumer" : c.reste<c.total ? "Reprendre" : (libDepart||"Allumer"); };
  const maj=()=>{ cire.style[prop]=(c.reste/c.total*100)+"%"; tps.textContent=fmt(c.reste); ch.classList.toggle("urgence",c.reste<=10); ch.classList.toggle("eteinte",c.reste<=0); lib(); };
  const tic=()=>{ c.reste=Math.max(0,c.reste-1); maj();
    if(c.reste<=10&&c.reste>0) Son.effet("coeur");
    if(c.reste<=0){ c.actif=false; arreterMinuterie(); Son.effet("gong"); lib(); if(aLaFin) aLaFin(true); } };
  const lancer=()=>{ arreterMinuterie(); minuterie={h:setInterval(tic,1000)}; };
  go.onclick=()=>{ if(c.actif){ c.actif=false; arreterMinuterie(); } else { if(c.reste<=0) c.reste=c.total; c.actif=true; lancer(); } maj(); };
  $("#tRe").onclick=()=>{ arreterMinuterie(); c.reste=c.total; c.actif=false; maj(); };
  maj();
  if(c.actif) lancer();
  else if(c.reste<=0 && aLaFin) aLaFin(false);
}

/* Indices progressifs : quatre bougies, une par indice. Quand la bougie de l'indice en cours s'éteint,
   l'indice suivant apparaît et sa bougie s'allume. Dévoiler un indice à la main éteint aussi la bougie en cours. */
const VALEURS_INDICES=[3,2,1,1];
function chandelierHTML(per, i, fumee){
  return `<div class="chandelier" id="chandelier" role="timer" aria-label="Une bougie par indice">
    <div class="bougies">${[0,1,2,3].map(k=>`<div class="bougie ${k<i?"eteinte":k===i?"allumee":"attente"} ${k===fumee?"souffle":""}">
        <div class="tube"><div class="cire" style="height:${k<i?0:100}%"><span class="flamme"></span><span class="fumee"></span></div></div>
        <span class="num">${k+1}</span><span class="val">${VALEURS_INDICES[k]} pt${VALEURS_INDICES[k]>1?"s":""}</span>
      </div>`).join("")}</div>
    ${per?`<div class="temps" id="tps">${fmt(per)}</div>
    <div class="bt"><button class="mini" id="tGo">Pause</button><button class="mini" id="tRe" aria-label="Rallumer la bougie">↺</button></div>`:""}
  </div>`;
}
function etatChandelier(id, per){
  const niv=E.niv[id]||1;
  let c=chronos[id];
  if(!c || c.per!==per || c.i===undefined) c=chronos[id]={per, reste:per, actif:per>0, i:niv-1};
  if(c.i<4 && c.i<niv-1){ c.i=niv-1; c.reste=per; }
  return c;
}
function brancherChandelier(id, per){
  const c=etatChandelier(id, per);
  const bougies=[...scene.querySelectorAll("#chandelier .bougie")], tps=$("#tps"), go=$("#tGo"), re=$("#tRe");
  const maj=()=>{
    const urg = !!per && c.i<4 && c.reste<=5;
    bougies.forEach((b,k)=>{
      b.classList.toggle("eteinte",k<c.i); b.classList.toggle("allumee",k===c.i); b.classList.toggle("attente",k>c.i);
      b.classList.toggle("urgence", k===c.i && urg && c.actif);
      b.querySelector(".cire").style.height=(k<c.i ? 0 : (k===c.i && per ? c.reste/per*100 : 100))+"%";
    });
    if(tps){ tps.textContent=fmt(c.i<4?c.reste:0); tps.classList.toggle("urgence",urg); }
    if(go){ go.textContent = c.i>=4 ? "Terminé" : c.actif ? "Pause" : "Reprendre"; go.disabled = c.i>=4; }
  };
  const tic=()=>{
    c.reste=Math.max(0,c.reste-1);
    if(c.reste>0 && c.reste<=3) Son.effet(c.i===3?"coeur":"tic");
    if(c.reste<=0){
      Son.effet("souffle");
      if(c.i<3){ c.i++; c.reste=per; E.niv[id]=c.i+1; indiceFrais={id, k:c.i}; rendre.garde=true; rendre(); return; }
      c.i=4; c.actif=false; arreterMinuterie(); Son.effet("gong");
      const b=bougies[3]; if(b){ b.classList.remove("souffle"); void b.offsetWidth; b.classList.add("souffle"); }
    }
    maj();
  };
  const lancer=()=>{ arreterMinuterie(); minuterie={h:setInterval(tic,1000)}; };
  if(go) go.onclick=()=>{ if(c.i>=4) return; c.actif=!c.actif; if(c.actif) lancer(); else arreterMinuterie(); maj(); };
  if(re) re.onclick=()=>{ if(c.i>=4) c.i=3; c.reste=per; maj(); };
  maj();
  if(c.actif && per && c.i<4) lancer();
}

function consigneCorrection(q,m){
  let t = q.type==="maudite" ? "Touchez une équipe, puis choisissez son résultat."
        : q.type==="indices" ? "Touchez une équipe pour faire défiler 3, 2, 1 ou 0 point."
        : `Touchez les équipes qui ont la bonne réponse (${q.type==="ordre"?"2 points":"1 point"}).`;
  if(m>1) t+=" Le sortilège double les points.";
  return t;
}
function panneauPoints(st,q,fx){
  const id=st.id, eq=equipes(), pts=E.points[id]||[], m=fx.double?2:1;
  const mises = q.type==="maudite" ? (E.mises[id]||[]) : null;
  return `<div class="correction"><p class="eyebrow">Correction</p><p class="consigne">${consigneCorrection(q,m)}</p>
    <div class="jetons ${eq.length<=8?"grands":""}">${eq.map((n,i)=>{
      const p=pts[i]||0;
      const cls = p>0 ? "oui" : p<0 ? "non" : "";
      let aff = p>0 ? "+"+p : p<0 ? "−"+Math.abs(p) : "0";
      if(mises && typeof mises[i]!=="number" && !p) aff="·";
      const attr = mises ? 'aria-haspopup="dialog"' : `aria-pressed="${p>0}"`;
      return `<button class="jeton ${cls}" data-eq="${i}" ${attr}><span class="nm">${esc(n)}</span><span class="pts">${aff}</span></button>`;
    }).join("")}</div></div>`;
}
function brancherPoints(st,q,fx){
  const id=st.id, m=fx.double?2:1;
  if(!E.points[id]) E.points[id]=Array(E.nbEq).fill(0);
  const P=E.points[id];
  if(q.type==="maudite"){
    if(!Array.isArray(E.mises[id])) E.mises[id]=[];
    const M=E.mises[id];
    scene.querySelectorAll(".jeton").forEach(b=>b.onclick=()=>{
      const i=+b.dataset.eq;
      choisirMaudite(equipes()[i], typeof M[i]==="number"?M[i]:null, m, v=>{
        if(v===null){ M[i]=null; P[i]=0; } else { M[i]=v; P[i]=v*m; if(v>0) Son.effet("bon"); }
        rendre.garde=true; rendre();
      });
    });
    return;
  }
  const base = q.type==="ordre"?2:1;
  scene.querySelectorAll(".jeton").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.eq;
    if(q.type==="indices"){ const cyc=[0,3,2,1]; const cur=(P[i]||0)/m; P[i]=cyc[(cyc.indexOf(cur)+1)%4]*m; }
    else P[i] = P[i]>0 ? 0 : base*m;
    if(P[i]>0) Son.effet("bon");
    rendre.garde=true; rendre();
  });
}
/* Question maudite : un toucher sur l'équipe, un toucher sur son résultat. */
function choisirMaudite(nom, actuel, m, choisir){
  const vals=[-3,-2,-1,0,1,2,3];

/* ---------- Roue des maléfices ---------- */
function vRoue(st){
  const id=st.id, res=E.roue[id];
  scene.innerHTML = `<div class="centre roue-zone apparait">
    <div class="fleche"><canvas id="cv" width="700" height="700" aria-label="Roue des maléfices"></canvas></div>
    <div>
      <p class="eyebrow">Entracte</p>
      <h2>La roue des maléfices</h2>
      <div class="verdict" id="verdict">${res?`<b>${esc(ROUE[res.i].nom)}</b>${esc(ROUE[res.i].texte)}${detailRoue(res)}`:"Le sort de toutes les confréries tient à un tour de roue. Qui ose la faire tourner?"}</div>
      <div class="actions">${res?"":'<button class="btn plein gros" id="tourne">Faire tourner la roue</button>'}</div>
    </div>
  </div>`;
  const cv=$("#cv"); let ang = res ? angleFin(res.i,0) : 0;
  dessinerRoue(cv,ang);
  if(!res) $("#tourne").onclick=()=>{
    $("#tourne").disabled=true;
    const i=Math.floor(Math.random()*ROUE.length);
    const fin=angleFin(i,5), debut=performance.now(), D=5200, a0=0; let dernier=-1;
    Son.effet("tonnerre");
    (function anim(t){
      const k=Math.min(1,(t-debut)/D), e=1-Math.pow(1-k,4), a=a0+(fin-a0)*e;
      dessinerRoue(cv,a);
      const seg=Math.floor(((-a%(2*Math.PI))+4*Math.PI)%(2*Math.PI)/(2*Math.PI/ROUE.length));
      if(seg!==dernier){ dernier=seg; Son.effet("tic"); }
      if(k<1) requestAnimationFrame(anim); else appliquerRoue(st,i);
    })(debut);
  };
}
function angleFin(i,tours){ const s=2*Math.PI/ROUE.length; return -(tours*2*Math.PI + i*s + s/2) ; }
function dessinerRoue(cv,ang){
  const x=cv.getContext("2d"), R=330, C=350, s=2*Math.PI/ROUE.length;
  x.clearRect(0,0,700,700);
  x.save(); x.translate(C,C); x.rotate(ang - Math.PI/2);
  ROUE.forEach((r,i)=>{
    x.beginPath(); x.moveTo(0,0); x.arc(0,0,R,i*s,(i+1)*s); x.closePath();
    x.fillStyle=r.c; x.fill(); x.strokeStyle="rgba(240,178,87,.55)"; x.lineWidth=2; x.stroke();
    x.save(); x.rotate(i*s+s/2); x.textAlign="right"; x.fillStyle="#ece0c4";
    x.font='34px "IM Fell English SC", Georgia, serif'; x.fillText(r.nom,R-26,12); x.restore();
  });
  x.restore();
  x.beginPath(); x.arc(C,C,46,0,6.283); x.fillStyle="#0a0e16"; x.fill(); x.strokeStyle="#f0b257"; x.lineWidth=3; x.stroke();
  x.beginPath(); x.arc(C,C,R,0,6.283); x.strokeStyle="#f0b257"; x.lineWidth=5; x.stroke();
}
function detailRoue(res){
  const n=t=>`<span class="note" style="display:block;margin-top:.6rem;color:var(--follet)">${t}</span>`;
  const noms=()=>esc((res.qui||[]).map(i=>equipes()[i]).join(", "));
  if(res.cible){ const st=ETAPES.find(s=>s.id===res.cible); return n(`S'appliquera automatiquement à la question ${st.q+1} du chapitre ${st.c+1} (${esc(CHAPITRES[st.c].nom)}).`); }
  if(res.i===0) return n(`Points ajoutés automatiquement : +3 à ${noms()}.`);
  if(res.i===1) return n(`Points retirés automatiquement : 2 points de moins à ${noms()}.`);
  if(res.i===2) return n("Points ajoutés automatiquement : +1 à toutes les équipes.");
  return "";
}
function appliquerRoue(st,i){
  const id=st.id, eq=equipes(), tot=eq.map((_,k)=>total(k)), res={i};
  const pts=Array(E.nbEq).fill(0);
  if(i===0){ const mn=Math.min(...tot); res.qui=tot.map((v,k)=>v===mn?k:-1).filter(k=>k>=0); res.qui.forEach(k=>pts[k]=3); }
  if(i===1){ const mx=Math.max(...tot); res.qui=tot.map((v,k)=>v===mx?k:-1).filter(k=>k>=0); res.qui.forEach(k=>pts[k]=-2); }
  if(i===2){ pts.fill(1); }
  const idx=ETAPES.indexOf(st);
  if(i===3||i===4) res.cible=idQuestionSuivante(idx);
  if(i===5) res.cible=idQuestionSuivante(idx, q=>q.type==="qcm"||q.type==="maudite");
  E.roue[id]=res; E.points[id]=pts;
  Son.effet(i===1?"tonnerre":"revele");
  rendre();
}

    <p>Vous pouvez revenir en arrière sans perdre de points : chaque question garde ses propres points.</p>
    <div class="actions"><button class="btn plein" id="fermeAide">Fermer</button></div></div>`;
  document.body.appendChild(d); $("#fermeAide").onclick=()=>d.remove(); d.onclick=e=>{ if(e.target===d) d.remove(); };
}
/* ---------- Documents à imprimer ----------
   Les trois PDF sont intégrés au fichier (PDF_DOCUMENTS) : le bouton fonctionne en ligne comme hors ligne,
   et la partie en cours reste intacte. */
const DOCUMENTS = [
  {id:"carnet", titre:"Carnet d'enquête", fichier:"carnet-enquete.pdf", desc:"2 pages, recto verso. Un carnet par équipe."},
  {id:"fiches", titre:"Fiches historiques", fichier:"fiches-historiques.pdf", desc:"6 fiches. Un jeu par équipe, ramassé après chaque lecture."},
  {id:"guide", titre:"Guide de l'animateur", fichier:"guide-animateur.pdf", desc:"Le déroulement, les commandes et la solution.", alerte:"À ne pas ouvrir devant les élèves : la solution s'afficherait au TBI."}
];
const urlsDocuments = {};
/* Sur le site, les PDF sont aussi servis à côté de l'activité : on ouvre alors le vrai fichier
   (onglet bien nommé). Hors ligne, on ouvre la copie intégrée. */
const docsEnLigne = {};
function verifierDocsEnLigne(){
  if(!/^https?:$/.test(location.protocol) || !window.fetch) return;
  DOCUMENTS.forEach(d=>{ docsEnLigne[d.id]=false;
    fetch(d.fichier,{method:"HEAD"}).then(r=>{ docsEnLigne[d.id] = r.ok && /pdf/i.test(r.headers.get("content-type")||""); }).catch(()=>{}); });
}
const blobsDocuments = {};
function blobDocument(id){
  if(blobsDocuments[id]) return blobsDocuments[id];
  const b64 = (typeof PDF_DOCUMENTS!=="undefined" && PDF_DOCUMENTS[id]) || "";
  if(!b64) return null;
  try{
    const bin = atob(b64), oct = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) oct[i] = bin.charCodeAt(i);
    return blobsDocuments[id] = new Blob([oct], {type:"application/pdf"});
  }catch(e){ return null; }
}
function urlDocument(id){
  if(urlsDocuments[id]) return urlsDocuments[id];
  const b = blobDocument(id);
  return b ? (urlsDocuments[id] = URL.createObjectURL(b)) : null;
}
/* Dans l'aperçu claude.ai, un téléchargement passe par la permission « downloads » de l'artefact.
   Ailleurs (site, fichier hors ligne), window.claude n'existe pas et rien ne change. */
let telechargeurArtefact = null;
try{ if(window.claude && typeof window.claude.use==="function") window.claude.use("downloads").then(n=>{ telechargeurArtefact=n; }).catch(()=>{}); }catch(e){}
function telechargerDocument(d, etat, avant){
  const dit = t=>{ if(etat) etat((avant||"")+t); };
  if(telechargeurArtefact){
    const b = blobDocument(d.id); if(!b) return false;
    telechargeurArtefact.save({filename:d.fichier, data:b})
      .then(()=>dit("Téléchargement lancé : "+d.fichier+"."))
      .catch(e=>dit(e && e.code==="declined" ? "Téléchargement annulé." : "Le téléchargement n'est pas offert ici."));
    return true;
  }
  const u = urlDocument(d.id); if(!u) return false;
  const a = document.createElement("a"); a.href = u; a.download = d.fichier;
  document.body.appendChild(a); a.click(); a.remove();
  dit("Téléchargement lancé : "+d.fichier+".");
  return true;
}
function ouvrirDocument(d, etat){
  if(telechargeurArtefact) return telechargerDocument(d, etat);   /* aperçu claude.ai : pas de nouvel onglet */
  /* Sur le site : le fichier du site, avec un paramètre unique pour toujours obtenir la dernière version
     (GitHub garde un PDF 10 minutes dans la cache du navigateur). Hors ligne : la copie intégrée. */
  const u = docsEnLigne[d.id] ? d.fichier+"?v="+Date.now() : urlDocument(d.id); if(!u) return false;
  let w = null;
  try{ w = window.open(u, "_blank"); }catch(e){}
  if(w){ if(etat) etat(d.titre+" : ouvert dans un nouvel onglet."); return true; }
  return telechargerDocument(d, etat, "Nouvel onglet bloqué. ");   /* on télécharge plutôt */
}
function documents(){
  if($(".documents")){ $(".documents").remove(); return; }
  const d = document.createElement("div"); d.className = "documents";
  d.setAttribute("role","dialog"); d.setAttribute("aria-modal","true"); d.setAttribute("aria-label","Documents à imprimer");
  d.innerHTML = `<div class="boite"><h3>Documents</h3>
    <p class="sous">Chaque document s'ouvre dans un nouvel onglet, prêt à imprimer. La partie reste en place ici; en revenant, touchez Plein écran au besoin.</p>
    ${DOCUMENTS.map(x=>`<div class="doc"><div><b>${esc(x.titre)}</b><span>${esc(x.desc)}</span>${x.alerte?`<span class="garde">${esc(x.alerte)}</span>`:""}</div><button class="btn" data-ouvrir="${x.id}">Ouvrir</button><button class="btn" data-telecharger="${x.id}">Télécharger</button></div>`).join("")}
    <p class="etat" id="etatDocs" aria-live="polite"></p>
    <div class="actions"><button class="btn plein" id="fermeDocs">Fermer</button></div></div>`;
  document.body.appendChild(d);
  const etat = t=>{ const e=$("#etatDocs"); if(e) e.textContent=t; };
  const trouver = id=>DOCUMENTS.find(x=>x.id===id);
  d.querySelectorAll("[data-ouvrir]").forEach(b=>b.onclick=()=>{ if(!ouvrirDocument(trouver(b.dataset.ouvrir), etat)) etat("Ce document est introuvable dans ce fichier."); });
  d.querySelectorAll("[data-telecharger]").forEach(b=>b.onclick=()=>{ if(!telechargerDocument(trouver(b.dataset.telecharger), etat)) etat("Ce document est introuvable dans ce fichier."); });
  $("#fermeDocs").onclick=()=>d.remove();
  d.onclick=e=>{ if(e.target===d) d.remove(); };
  try{ $("#fermeDocs").focus(); }catch(e){}
}
$("#bPrec").onclick=()=>aller(E.etape-1);
$("#bSuiv").onclick=()=>aller(E.etape+1);
$("#bTableau").onclick=ouvrirTableau;
$("#bSon").onclick=()=>basculerSon();
$("#bEcran").onclick=pleinEcran;
$("#bAide").onclick=aide;
$("#bDocs").onclick=documents;
document.addEventListener("keydown",e=>{
  if(choixOuvert){ if(e.key==="Escape"){ e.preventDefault(); fermerChoix(); } return; }
  if($(".documents")){ if(e.key==="Escape"||e.key==="d"||e.key==="D"){ e.preventDefault(); documents(); } return; }
  if($(".aide")){ if(e.key==="Escape"||e.key==="h"||e.key==="H"||e.key==="?"){ e.preventDefault(); aide(); } return; }
  if(e.target.matches("input,select,textarea")) return;
  if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); aller(E.etape+1); }
  else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); aller(E.etape-1); }
  else if(e.key==="t"||e.key==="T") ouvrirTableau();
  else if(e.key==="m"||e.key==="M") basculerSon();
  else if(e.key==="f"||e.key==="F") pleinEcran();
  else if(e.key==="d"||e.key==="D") documents();
  else if(e.key==="h"||e.key==="H"||e.key==="?") aide();
});
function reajuster(){ ajusterEchelle(); if($("#lectureCorps")) ajusterLecture(); }
let attenteRedim=null;
addEventListener("resize",()=>{ clearTimeout(attenteRedim); attenteRedim=setTimeout(reajuster,120); });

rendre();
try{ document.fonts && document.fonts.ready.then(()=>{ if(ETAPES[E.etape].t==="roue"){ rendre.garde=true; rendre(); } else reajuster(); }); }catch(e){}
try{ verifierDocsEnLigne(); }catch(e){}
</script>
